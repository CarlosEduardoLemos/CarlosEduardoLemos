name: Generate contribution assets

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/snake.yml'

permissions:
  contents: write

concurrency:
  group: profile-contribution-assets
  cancel-in-progress: false

jobs:
  cards:
    name: Refresh contribution cards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Inter and WOFF subsetting tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-inter fontconfig
          python -m pip install --disable-pip-version-check 'fonttools[woff]>=4.50,<5'

      - name: Run contribution and SVG tests
        run: python -m unittest discover -s tests -v

      - name: Fetch and validate the contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_contributions.py

      - name: Validate the saved contribution JSON
        run: python scripts/validate_contributions.py

      - name: Render profile cards
        run: python scripts/render_cards.py

      - name: Validate generated SVGs
        run: python scripts/validate_cards.py

      - name: Commit changed data and cards to main
        # Repository rules must allow github-actions[bot] to push generated assets to main.
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/contributions.json cards/
          if git diff --cached --quiet; then
            echo 'Contribution JSON and cards are already current.'
            exit 0
          fi
          git commit -m 'chore: refresh profile contribution cards'
          git push origin HEAD:main

  snake:
    name: Generate optional contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3.1.0
        with:
          github_user_name: CarlosEduardoLemos
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep generated snake SVGs as an optional artifact
        uses: actions/upload-artifact@v4
        with:
          name: contribution-snake
          path: dist/*.svg
          if-no-files-found: ignore
          retention-days: 7
